name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docker.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: pip install -r requirements-docker.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.cjs
      - uses: docker/setup-buildx-action@v4.4.1
      - name: 构建测试镜像（持久化缓存）
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: rail-test
          cache-from: type=gha,version=2,scope=rail-test
          cache-to: type=gha,version=2,scope=rail-test,mode=max,ignore-error=true
      - run: python scripts/smoke_docker.py rail-test
