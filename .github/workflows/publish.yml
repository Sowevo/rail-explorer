name: Publish images
on:
  workflow_dispatch:
    inputs:
      mode:
        description: program 发布当前 main 程序及中日镜像；data 只更新已发布程序的数据
        type: choice
        options: [program, data]
        default: program
      region:
        description: 数据更新的区域（程序发布始终包括中日）
        type: choice
        options: [all, china, japan]
        default: all
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: rail-image-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'schedule' || vars.ENABLE_DATA_UPDATES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode || 'data' }}
      REGION: ${{ inputs.region || 'all' }}
    steps:
      - name: 仅允许默认分支发布
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 数据更新使用已发布代码
        if: env.MODE == 'data'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$image"
          revision=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$revision"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docker.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - run: pip install -r requirements-docker.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.cjs
      - name: 构建测试镜像（持久化缓存）
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: rail-test
          cache-from: type=gha,version=2,scope=rail-test
          cache-to: type=gha,version=2,scope=rail-test,mode=max,ignore-error=true
      - name: 容器入口和完整索引流程检查
        run: python scripts/smoke_docker.py rail-test
      - name: 构建、验证并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: python scripts/release.py --mode "$MODE" --region "$REGION"
